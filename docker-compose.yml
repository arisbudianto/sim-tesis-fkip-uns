services:
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    container_name: sim-tesis-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sim-tesis

  nginx:
    image: nginx:1.27-alpine
    container_name: sim-tesis-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sim-tesis

  mysql:
    image: mysql:8.0
    container_name: sim-tesis-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sim_tesis
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sim_tesis
      MYSQL_PASSWORD: sim_tesis
    ports:
      - "3306:3306"
    volumes:
      - sim-tesis-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sim-tesis

  vite:
    image: node:20-alpine
    container_name: sim-tesis-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    networks:
      - sim-tesis

networks:
  sim-tesis:
    driver: bridge

volumes:
  sim-tesis-mysql-data:
